name: CI

# This repository had no CI at all.
#
# The GOOS list below was measured on this module, not copied: every pair was
# cross-built locally first, and `go test -race` was run. A matrix written
# from a template rather than from measurement lands red on its first run, and
# a red lane nobody reads is how a sibling repo (weft-microvm-agent) kept a
# broken linux build for weeks while darwin and the BSDs went green.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
      - run: go vet ./...
      - name: test, with coverage
        run: go test -count=1 -covermode=set -coverprofile=coverage.out ./...
      # Every sibling module gates at 100% and this one had no gate at all,
      # though it stood at 100.0% when the gate was added (2026-10-10). Exact,
      # no rounding: any function or the total below 100.0% fails.
      - name: assert 100% statement coverage
        run: |
          go tool cover -func=coverage.out
          below=$(go tool cover -func=coverage.out | awk '$NF != "100.0%"')
          if [ -n "$below" ]; then
            echo "::error::coverage below 100% on:"
            echo "$below"
            exit 1
          fi

  race:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
      - run: go test -race -count=1 ./...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
        goos:
          - linux
          - darwin
          - freebsd
          - openbsd
          - netbsd
          - windows
        goarch: [amd64, arm64]
        # The other four 64-bit Linux architectures the fleet ships on, s390x
        # among them for its big-endian byte order. Cross-built locally first.
        include:
          - { module: ., goos: linux, goarch: riscv64 }
          - { module: ., goos: linux, goarch: loong64 }
          - { module: ., goos: linux, goarch: ppc64le }
          - { module: ., goos: linux, goarch: s390x }
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build ./...
